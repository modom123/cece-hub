# ────────────────────────────────────────────────────────────────
# FILE: stripe-go-live_2026-10-21_1950.yml
# CREATED: 2026-10-21_1950 UTC
# WHY: One-click Stripe setup for cecespieces. Run it from GitHub →
#      Actions → "Stripe — go live" → Run workflow. It:
#        1. stores the Stripe key + site URL in a locked database table
#           (private.app_secrets; only the payment functions can read it)
#        2. deploys create-checkout, stripe-webhook, send-balance-invoice
#        3. creates the Stripe webhook endpoint (checkout + invoice events)
#           and stores its signing secret — no dashboard clicking
#        4. tests that checkout can reach Stripe and lists priced pieces
#        5. (2026-10-21_2120) sets up the database (gallery table, Stripe id
#           columns, change triggers), deploys sync-stripe-catalog and syncs
#           every piece + class into Stripe Products/Prices. After this,
#           edits in the hub reach Stripe automatically.
#      Needs two GitHub repo secrets (Settings → Secrets → Actions):
#        SUPABASE_ACCESS_TOKEN  — supabase.com → Account → Access Tokens
#        STRIPE_SECRET_KEY      — Stripe → Developers → API keys (sk_test_… or sk_live_…)
#      Safe to re-run any time (e.g. when switching test → live keys).
# ────────────────────────────────────────────────────────────────
name: Stripe — go live

on:
  # Also runs when supabase/GO-LIVE_TRIGGER.md changes on main, so setup can be
  # started by a commit as well as the Run workflow button.
  push:
    branches: [main]
    paths: ['supabase/GO-LIVE_TRIGGER.md']
  workflow_dispatch:
    inputs:
      site_url:
        description: "Live website URL (where buyers return after paying)"
        required: true
        default: "https://cecespieces.com"

env:
  PROJECT_REF: tssicoxzxcfijdlvtpqm
  SUPABASE_URL: https://tssicoxzxcfijdlvtpqm.supabase.co

jobs:
  go-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the two required secrets are set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          ok=1
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Add the SUPABASE_ACCESS_TOKEN repo secret (supabase.com → Account → Access Tokens)."; ok=0; }
          [ -n "$STRIPE_SECRET_KEY" ]     || { echo "::error::Add the STRIPE_SECRET_KEY repo secret (Stripe → Developers → API keys)."; ok=0; }
          [ $ok = 1 ] || exit 1
          case "$STRIPE_SECRET_KEY" in
            sk_live_*) echo "MODE=LIVE — real cards will be charged" >> "$GITHUB_ENV" ;;
            sk_test_*) echo "MODE=TEST — use card 4242 4242 4242 4242" >> "$GITHUB_ENV" ;;
            rk_*)      echo "MODE=RESTRICTED KEY — must allow Checkout Sessions, Webhook Endpoints, Customers, Invoices (write)" >> "$GITHUB_ENV" ;;
            *)         echo "::error::STRIPE_SECRET_KEY doesn't look like a Stripe secret key (sk_… or rk_…)."; exit 1 ;;
          esac

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set up the database (gallery, Stripe ids, auto-sync triggers)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          BODY=$(jq -Rs '{query: .}' < supabase/migrations/stripe_catalog_sync_2026-10-21_2120.sql)
          CODE=$(curl -sS -o out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$BODY")
          if [ "$CODE" -ge 300 ]; then cat out.json; echo "::error::Database setup failed ($CODE)"; exit 1; fi
          echo "Database setup applied."

      - name: Store Stripe key and site URL (locked database table)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SITE_URL: ${{ inputs.site_url || 'https://cecespieces.com' }}
        run: |
          # Stored in private.app_secrets (readable only by the payment functions)
          # instead of Edge Function secrets, so the token only needs SQL access.
          KEY="$(printf %s "$STRIPE_SECRET_KEY" | tr -d '[:space:]')"
          BODY=$(jq -n --arg k "$KEY" --arg u "$SITE_URL" '{query: ("insert into private.app_secrets(name,value) values (\u0027STRIPE_SECRET_KEY\u0027, $k$" + $k + "$k$), (\u0027SITE_URL\u0027, $k$" + $u + "$k$) on conflict (name) do update set value = excluded.value, updated_at = now();")}')
          CODE=$(curl -sS -o out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$BODY")
          if [ "$CODE" -ge 300 ]; then echo "::error::Could not store the Stripe key ($CODE): $(jq -r '.message // .' out.json)"; exit 1; fi
          rm -f out.json; echo "Stripe key + site URL stored."

      - name: Deploy the payment functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy sync-stripe-catalog  --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy create-checkout      --project-ref "$PROJECT_REF"
          supabase functions deploy send-balance-invoice --project-ref "$PROJECT_REF"
          supabase functions deploy stripe-webhook       --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Create the Stripe webhook and store its signing secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          KEY="$(printf %s "$STRIPE_SECRET_KEY" | tr -d '[:space:]')"
          URL="$SUPABASE_URL/functions/v1/stripe-webhook"
          # A signing secret is only revealed when an endpoint is created, so
          # replace any existing endpoint for this URL with a fresh one.
          for id in $(curl -sS -u "$KEY:" "https://api.stripe.com/v1/webhook_endpoints?limit=100" | jq -r --arg u "$URL" '.data[]? | select(.url==$u) | .id'); do
            curl -sS -u "$KEY:" -X DELETE "https://api.stripe.com/v1/webhook_endpoints/$id" > /dev/null && echo "Replaced old endpoint $id"
          done
          RESP=$(curl -sS -u "$KEY:" https://api.stripe.com/v1/webhook_endpoints \
            -d url="$URL" \
            -d "enabled_events[]=checkout.session.completed" \
            -d "enabled_events[]=invoice.paid" \
            -d description="cecespieces — mark pieces sold / confirm deposits & classes")
          WHSEC=$(echo "$RESP" | jq -r '.secret // empty')
          if [ -z "$WHSEC" ]; then
            echo "::error::Stripe would not create the webhook: $(echo "$RESP" | jq -r '.error.message // "unknown error"')"; exit 1
          fi
          echo "::add-mask::$WHSEC"
          BODY=$(jq -n --arg w "$WHSEC" '{query: ("insert into private.app_secrets(name,value) values (\u0027STRIPE_WEBHOOK_SECRET\u0027, $w$" + $w + "$w$) on conflict (name) do update set value = excluded.value, updated_at = now();")}')
          CODE=$(curl -sS -o out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$BODY")
          if [ "$CODE" -ge 300 ]; then echo "::error::Could not store the webhook secret ($CODE)"; exit 1; fi
          rm -f out.json
          echo "Webhook endpoint $(echo "$RESP" | jq -r .id) created → $URL"

      - name: Sync every piece and class into Stripe
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          SECRET=$(curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"query":"select secret from stripe_sync_config where id = 1"}' | jq -r '.[0].secret // empty')
          [ -n "$SECRET" ] || { echo "::error::Could not read the sync secret"; exit 1; }
          echo "::add-mask::$SECRET"
          sleep 5
          RES=$(curl -sS -X POST "$SUPABASE_URL/functions/v1/sync-stripe-catalog" -H "Content-Type: application/json" -H "x-sync-secret: $SECRET" -d '{"full":true}')
          echo "$RES" | jq -r '.log[]? // empty'
          N=$(echo "$RES" | jq -r '.synced // 0'); W=$(echo "$RES" | jq '[.log[]? | select(startswith("⚠️"))] | length')
          echo "SYNCED=$N" >> "$GITHUB_ENV"; echo "SYNC_WARN=$W" >> "$GITHUB_ENV"
          [ "$(echo "$RES" | jq -r '.ok // false')" = "true" ] || { echo "::error::Sync failed: $(echo "$RES" | jq -r '.error // .')"; exit 1; }

      - name: Test checkout end-to-end
        run: |
          ANON=$(grep -o "eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*" cece-hub.html | head -1)
          H=(-H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H "Content-Type: application/json")
          sleep 5
          PING=$(curl -sS "${H[@]}" -X POST "$SUPABASE_URL/functions/v1/create-checkout" -d '{"_ping":true}')
          STATUS=$(echo "$PING" | jq -r '.stripe_status // "no response"')
          PIECES=$(curl -sS "${H[@]}" "$SUPABASE_URL/rest/v1/pieces?select=id,title,price,deposit,status&order=title")
          PRICED=$(echo "$PIECES" | jq '[.[]? | select((.price // "") != "" and (.status // "available") != "sold")] | length')
          DEPOS=$(echo "$PIECES" | jq '[.[]? | select((.deposit // "") != "")] | length')
          FIRST=$(echo "$PIECES" | jq -r '[.[]? | select((.price // "") != "" and (.status // "available") != "sold")][0].id // empty')
          CO="(no priced piece to test)"
          if [ -n "$FIRST" ]; then
            CO=$(curl -sS "${H[@]}" -X POST "$SUPABASE_URL/functions/v1/create-checkout" -d "{\"piece_id\":\"$FIRST\"}" | jq -r 'if .url then "✅ Stripe checkout page created" else "❌ " + (.error // "failed") end')
          fi
          {
            echo "## Stripe setup — $MODE"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Payment functions deployed | ✅ |"
            echo "| Webhook created + signing secret stored | ✅ |"
            echo "| Checkout can reach Stripe | $([ "$STATUS" = "200" ] && echo "✅" || echo "❌ (Stripe answered $STATUS — check the key)") |"
            echo "| Pieces for sale with a price | $PRICED |"
            echo "| Pieces taking a deposit | $DEPOS |"
            echo "| Test checkout for a real piece | $CO |"
            echo "| Products synced to Stripe | $SYNCED$([ "${SYNC_WARN:-0}" != "0" ] && echo " (⚠️ $SYNC_WARN with problems — see the sync step log)") |"
            echo "| Automatic sync on every hub change | ✅ |"
            echo ""
            echo "Prices are read from the hub's database at the moment of purchase, so any price you change in the hub is what Stripe charges — no re-run needed."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = "200" ] || exit 1
