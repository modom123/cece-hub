function val(id){return document.getElementById(id).value.trim();}
async function insert(body){
  return fetch(SUPABASE_URL+'/rest/v1/pieces',{method:'POST',
    headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=representation'},
    body:JSON.stringify(body)});
}
async function publish(){
  const btn=document.getElementById('go'),out=document.getElementById('out');
  btn.disabled=true;btn.textContent='Publishing…';out.className='';out.style.display='none';
  const base={title:val('f-title'),type:val('f-type'),price:val('f-price')||null,
    dimensions:val('f-dims')||null,materials:val('f-mats')||null,description:val('f-desc')||null,
    caption:val('f-cap')||null,status:'available',for_sale:true,for_rent:false,image:IMG_ONYX,
    date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})};
  const withVars=Object.assign({},base,{variations:[{image:IMG_GOLDEN,label:'Golden'},{image:IMG_IVORY,label:'Ivory & Gold'}]});
  try{
    let r=await insert(withVars); let note='';
    if(!r.ok){const t=await r.text();
      if(/variations/.test(t)){ r=await insert(base); note=' (Note: the drag/click colorways need the "variations" column — run the ALTER SQL, then re-publish to add them.)'; }
      else throw new Error(t.slice(0,200));
    }
    if(!r.ok) throw new Error((await r.text()).slice(0,200));
    const rows=await r.json();
    out.className='ok';out.innerHTML='✅ Published! "'+val('f-title')+'" is now in your database (id '+(rows[0]&&rows[0].id||'?')+'). Refresh your website to see it in the shop.'+note+'<br><br>You can safely delete this publisher file now.';
    btn.textContent='Published ✓';
  }catch(e){
    out.className='err';out.textContent='⚠️ '+(e.message||'Publish failed. Check that the pieces table exists and allows public insert.');
    btn.disabled=false;btn.textContent='🚀 Publish to my website + hub';
  }
}
